<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Nitin Mistry — Flutter & Android developer. Six years, 1.5M+ downloads.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nitin Mistry">
  <meta name="theme-color" content="#0B0A08">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>Nitin Mistry — Flutter Developer</title>
</head>
<body>
  <style>
    html, body { margin: 0; height: 100%; background: #0B0A08; }
    #boot {
      position: fixed; inset: 0; display: grid; place-items: center;
      color: #C9A36A; font-family: Georgia, "Times New Roman", serif;
      letter-spacing: 0.04em; text-align: center;
    }
    #boot em { font-style: italic; color: #E4C98A; }
    #boot span { display: block; margin-top: 10px; font-family: system-ui, sans-serif;
      font-size: 11px; letter-spacing: 0.22em; color: #9A9184; }
  </style>
  <div id="boot">Nitin <em>Mistry</em><span>FLUTTER PORTFOLIO</span></div>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    _flutter.loader.load({
      config: { suppressMultithreadingWarning: true }
    });
  </script>
</body>
</html>
